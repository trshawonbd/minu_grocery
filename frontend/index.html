<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minu</title>
<style>
  :root {
    --bg: #F4F5F0; --card: #FFFFFF; --line: #E1E1D6; --ink: #1C1B17; --muted: #6B6A5F;
    --green: #1F5D46; --green-soft: #E4F0EA; --amber: #A6522B; --amber-soft: #FBEADF;
    --barbora: #B45309; --rimi: #B91C1C; --selver: #1D4ED8; --coop: #0F766E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: 76px; }
  .page { max-width: 560px; margin: 0 auto; padding: 16px 16px 8px; }
  .brand { font-size: 15px; font-weight: 700; color: var(--green); letter-spacing: 0.08em; }
  .tagline { font-size: 12.5px; color: var(--muted); margin: 2px 0 12px; }
  .screen-title { font-size: 19px; font-weight: 700; margin: 8px 0 6px; line-height: 1.25; }
  .section-title { font-size: 15px; font-weight: 700; margin: 22px 0 10px; }
  .muted { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .header { display: flex; align-items: center; margin: 2px 0 6px; }
  .back, .btn-add, .qty-btn, .qty-remove, .group-item, .tab, .pcard-open, .nav-item, .basket-name {
    -webkit-appearance: none; appearance: none; border: none; background: none; font: inherit; color: inherit; cursor: pointer; text-align: left; padding: 0;
  }
  /* A store-row that's also a <button> (a clickable mall/shop row in
     the Outletid tab) — plain non-clickable store-row divs (the
     grocery single-store rows, a shop with no discount data) are
     untouched, tag-qualified so the reset never implies clickability
     where there is none. */
  button.store-row { -webkit-appearance: none; appearance: none; border: none; background: none; font: inherit; color: inherit; cursor: pointer; text-align: left; padding: 12px 14px; width: 100%; }
  .back { font-size: 13px; font-weight: 600; color: var(--green); padding: 6px 10px 6px 0; }
  .update-status { font-size: 11.5px; color: var(--muted); margin: 18px 0 8px; }
  .update-status.stale { color: var(--amber); font-weight: 600; }

  .searchbar input {
    width: 100%; font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none;
  }
  .searchbar input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }

  .cat-icon { width: 28px; height: 28px; color: var(--green); }
  .title-icon { width: 24px; height: 24px; vertical-align: -4px; margin-right: 8px; }
  .lang-switch { display: flex; align-items: center; gap: 4px; margin: 4px 0 8px; font-size: 11.5px; color: var(--muted); }
  .lang-label { margin-right: 4px; }
  .lang-btn { -webkit-appearance: none; appearance: none; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 8px; padding: 3px 8px; cursor: pointer; }
  .lang-btn.active { color: var(--green); border-color: var(--green); background: var(--green-soft); }

  /* Home screen's group row (2026-09-26): one horizontal, swipeable
     row of round group icons, replacing the old full-page grid of
     every display category — so the deal sections below fit on the
     first phone screen without scrolling. */
  .group-row { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -2px 4px; -webkit-overflow-scrolling: touch; }
  .group-item { flex: 0 0 66px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .group-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .group-item:hover .group-icon { border-color: var(--green); }
  .group-icon-svg { width: 26px; height: 26px; }
  .group-name { font-size: 10.5px; font-weight: 600; margin-top: 6px; line-height: 1.2; }
  .group-count { font-size: 9.5px; color: var(--muted); margin-top: 1px; }

  /* A group page's subcategory tabs ("Kõik" + one per category). */
  .tab-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; margin: 10px -2px 2px; -webkit-overflow-scrolling: touch; }
  .tab { flex: 0 0 auto; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; white-space: nowrap; }
  .tab.active { color: #fff; background: var(--green); border-color: var(--green); }

  .hrow { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .hrow .pcard { flex: 0 0 160px; scroll-snap-align: start; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .pcard-open { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .pcard-thumb, .row-thumb { width: 100%; aspect-ratio: 1; border-radius: 10px; background: #FAFAF6; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pcard-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pcard-name { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .pcard-price { font-size: 13.5px; font-weight: 700; color: var(--green); }
  .pcard-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pcard-stores { font-size: 11px; color: var(--muted); }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 999px; }
  .badge-gap { background: var(--green-soft); color: var(--green); }
  .badge-deal { background: var(--amber-soft); color: var(--amber); }
  .neutral-icon { width: 46%; height: 46%; color: #C9C8BC; }

  .qty { display: flex; align-items: center; gap: 8px; }
  .qty.large { margin: 10px 0 14px; }
  .btn-add { background: var(--green); color: #fff; font-weight: 700; font-size: 13px; padding: 9px 12px; border-radius: 10px; width: 100%; text-align: center; }
  .qty.large .btn-add { width: auto; padding: 11px 18px; font-size: 14px; }
  .qty-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-size: 18px; font-weight: 700; text-align: center; }
  .qty-value { min-width: 24px; text-align: center; font-weight: 700; font-size: 15px; }
  .qty-remove { font-size: 12px; color: var(--amber); font-weight: 600; margin-left: auto; }

  .product-image { display: flex; flex-direction: column; align-items: center; margin: 6px 0 8px; }
  .product-image .frame { width: 160px; height: 160px; border-radius: 14px; background: #FAFAF6; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .product-image img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .image-caption { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Outletid discount list (2026-09-26 redesign): a fashion-shop card
     grid — 2 columns on a phone, 4 on a desktop — each card one link
     to the brand's own product page. Photos are shown whole (contain),
     never cropped; the discount badge sits on the photo's corner. */
  .page-wide { max-width: 1100px; }
  .outlet-note { margin: 0 0 6px; }
  .outlet-meta { margin: 8px 0 10px; }
  .ogrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (min-width: 900px) { .ogrid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  .ocard { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; text-align: left; }
  .ocard:hover { border-color: var(--green); }
  .ocard-img { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #FAFAF6; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .ocard-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .ocard-badge { position: absolute; top: 8px; left: 8px; background: var(--amber); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 7px; border-radius: 8px; }
  .ocard-body { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 10px; }
  .ocard-brand { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .ocard-name { font-size: 13px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
  .ocard-price { font-size: 17px; font-weight: 700; color: var(--ink); margin-top: 4px; }
  .ocard-old { font-size: 12px; color: var(--muted); }

  .store-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .store-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .store-row.cheapest { background: var(--green-soft); border-color: var(--green); }
  .store-row .row-thumb { flex: 0 0 48px; width: 48px; height: 48px; }
  .store-left { min-width: 0; }
  .store-name { font-weight: 700; font-size: 14px; }
  .store-barbora { color: var(--barbora); } .store-rimi { color: var(--rimi); } .store-selver { color: var(--selver); } .store-coop { color: var(--coop); }
  .store-own-name { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
  .store-link { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--green); text-decoration: none; border: 1px solid var(--green); border-radius: 8px; padding: 4px 9px; }
  .store-link:hover { background: var(--green-soft); }
  .store-right { text-align: right; flex-shrink: 0; }
  .store-price { font-size: 16px; font-weight: 700; }
  .store-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .store-regular { text-decoration: line-through; }
  .store-availability-note { font-size: 11px; color: var(--amber); margin-top: 2px; font-style: italic; }
  .store-tag { font-size: 11.5px; font-weight: 700; margin-top: 4px; }
  .store-tag.best { color: var(--green); } .store-tag.more { color: var(--amber); }
  .single-row { background: #FAFAF6; }
  .single-name { font-size: 12.5px; font-weight: 600; margin-top: 2px; line-height: 1.3; }

  .basket-list { display: flex; flex-direction: column; gap: 8px; }
  .basket-line { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .basket-name { font-size: 13.5px; font-weight: 600; width: 100%; margin-bottom: 8px; line-height: 1.3; }
  .split { margin-top: 14px; background: var(--card); border: 1px dashed var(--green); border-radius: 12px; padding: 12px 14px; }
  .split-title { font-weight: 700; font-size: 14px; }
  .split-total { font-size: 15px; font-weight: 700; color: var(--green); margin: 4px 0; }
  .split-saving { font-size: 13px; font-weight: 600; color: var(--green); }

  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .nav-item.active { color: var(--green); }
  .nav-icon { display: flex; }
  .nav-svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="page" id="app"></div>
  <nav class="bottom" id="nav" aria-label="Main"></nav>

  <script src="/frontend/pricing.js"></script>
  <script src="/frontend/app-logic.js"></script>
  <script src="/frontend/catalog.js"></script>
  <script src="/frontend/i18n.js"></script>
  <script src="/frontend/outlets-logic.js"></script>
  <script src="/frontend/render.js"></script>
  <script>
    // The UI language: Estonian unless the shopper chose another one
    // (kept per browser in localStorage; i18n.js has en and ru ready).
    const LANG_STORAGE_KEY = "minu.lang";
    function loadLang() {
      try { return normalizeLang(localStorage.getItem(LANG_STORAGE_KEY)); } catch (err) { return DEFAULT_LANG; }
    }

    // State lives here; every screen is drawn by render.js from it.
    const state = {
      products: [],
      searchIndex: [],
      screen: "home",
      category: null,   // a display category id (frontend/catalog.js)
      group: null,       // a GROUPS id (frontend/catalog.js) — the home screen's own grouping
      groupTab: null,    // null ("Kõik") or one display category id within that group
      product: null,
      query: "",
      basket: loadBasket(typeof localStorage !== "undefined" ? localStorage : null),
      updatedAt: null,
      stale: false,
      lang: loadLang(),
      singles: [],       // data/singles.json — search results only
      singlesIndex: [],
      outletMalls: [],   // outlets/data/malls.json's own `malls` array
      outletBrands: [],  // one entry per outlets/data/<brand>.json fetched
      outletMallId: null,
      outletShopName: null,
      outletFilter: { ...DEFAULT_OUTLET_FILTER }, // the discount list's section/type/sort (outlets-logic.js)
    };
    const root = document.getElementById("app");
    const nav = document.getElementById("nav");
    document.documentElement.lang = state.lang;

    // Routes: #/  #/search  #/g/<group id>[/<display category id>]
    // #/c/<display category id>  #/p/<category::name>
    // #/outlets  #/outlets/<mall id>  #/outlets/<mall id>/<shop name>
    // #/basket
    function routeFromHash() {
      const rawHash = location.hash || "#/";
      // The outlets route is split on the RAW hash and each segment
      // decoded on its own: a real shop name can contain a "/" ("Juku /
      // Kidzone", "Marat / Sangar"), encoded as %2F — decoding the
      // whole hash first would turn it back into a separator and cut
      // the name short. Our own ids in the other routes never contain
      // one, so those keep the simpler whole-hash decode.
      if (rawHash.startsWith("#/outlets/")) {
        const [mallId, shopName] = rawHash.slice("#/outlets/".length).split("/").map((s) => decodeURIComponent(s));
        return shopName ? { screen: "outletShop", mallId, shopName } : { screen: "outletMall", mallId };
      }
      const hash = decodeURIComponent(rawHash);
      if (hash.startsWith("#/g/")) {
        const [group, tab] = hash.slice(4).split("/");
        return { screen: "group", group, groupTab: tab || null };
      }
      if (hash.startsWith("#/c/")) return { screen: "category", category: hash.slice(4) };
      if (hash.startsWith("#/p/")) return { screen: "product", key: hash.slice(4) };
      if (hash === "#/search") return { screen: "search" };
      if (hash === "#/outlets") return { screen: "outlets" };
      if (hash === "#/basket") return { screen: "basket" };
      return { screen: "home" };
    }

    function applyRoute() {
      const route = routeFromHash();
      state.screen = route.screen;
      if (route.screen === "category") state.category = route.category;
      if (route.screen === "group") { state.group = route.group; state.groupTab = route.groupTab; }
      if (route.screen === "outletMall") state.outletMallId = route.mallId;
      if (route.screen === "outletShop") {
        if (route.shopName !== state.outletShopName) state.outletFilter = { ...DEFAULT_OUTLET_FILTER };
        state.outletMallId = route.mallId;
        state.outletShopName = route.shopName;
      }
      if (route.screen === "product") {
        state.product = visibleProducts(state.products).find((p) => productKey(p) === route.key) || null;
        if (!state.product) state.screen = "home";
      }
      render();
      if (typeof window !== "undefined") window.scrollTo(0, 0);
    }

    const actions = {
      goto(screen) { location.hash = screen === "home" ? "#/" : `#/${screen}`; },
      goHome() { location.hash = "#/"; },
      openCategory(category) { location.hash = `#/c/${encodeURIComponent(category)}`; },
      openGroup(group, tab) { location.hash = tab ? `#/g/${encodeURIComponent(group)}/${encodeURIComponent(tab)}` : `#/g/${encodeURIComponent(group)}`; },
      openProduct(product) { location.hash = `#/p/${encodeURIComponent(productKey(product))}`; },
      openOutletMall(mallId) { location.hash = `#/outlets/${encodeURIComponent(mallId)}`; },
      openOutletShop(mallId, shopName) { location.hash = `#/outlets/${encodeURIComponent(mallId)}/${encodeURIComponent(shopName)}`; },
      setOutletFilter(patch) {
        state.outletFilter = { ...DEFAULT_OUTLET_FILTER, ...state.outletFilter, ...patch };
        render();
        if (typeof window !== "undefined") window.scrollTo(0, 0);
      },
      setQuery(query) {
        state.query = query;
        if (state.screen !== "search") { location.hash = "#/search"; return; }
        // Only the results re-render, so the input keeps focus and
        // typing never lags: the index is built once, per keystroke
        // it's a few thousand substring checks.
        const results = document.getElementById("search-results");
        if (results) renderSearchResults(results, state, actions);
      },
      setQuantity(key, quantity) {
        state.basket = setBasketQuantity(state.basket, key, quantity);
        saveBasket(typeof localStorage !== "undefined" ? localStorage : null, state.basket);
        render();
      },
      setLang(lang) {
        state.lang = normalizeLang(lang);
        document.documentElement.lang = state.lang;
        try { localStorage.setItem(LANG_STORAGE_KEY, state.lang); } catch (err) { /* per-browser convenience only */ }
        render();
      },
    };

    function render() {
      renderApp(root, nav, state, actions);
    }

    // How long data/prices.json can go without a successful daily
    // update before the line warns — 2 days (the job runs daily).
    const STALE_AFTER_MS = 2 * 24 * 60 * 60 * 1000;

    async function loadUpdateStatus() {
      try {
        const response = await fetch("/data/last-update.json");
        if (!response.ok) return;
        const { updatedAt } = await response.json();
        const date = new Date(updatedAt);
        if (isNaN(date.getTime())) return;
        state.updatedAt = date.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        state.stale = Date.now() - date.getTime() > STALE_AFTER_MS;
        render();
      } catch (err) {
        // Informational only — the rest of the page works without it.
      }
    }

    async function loadPrices() {
      try {
        const response = await fetch("/data/prices.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const prices = await response.json();
        if (!Array.isArray(prices) || prices.length === 0) throw new Error("data/prices.json is empty");
        state.products = prices;
        state.searchIndex = buildSearchIndex(prices);
        applyRoute();
      } catch (err) {
        renderError(root, state);
      }
    }

    // Single-store listings for the search screen's "Ainult ühes poes"
    // section — optional: the page works without the file.
    async function loadSingles() {
      try {
        const response = await fetch("/data/singles.json");
        if (!response.ok) return;
        const singles = await response.json();
        if (!Array.isArray(singles)) return;
        state.singles = singles;
        state.singlesIndex = buildSinglesIndex(singles);
        if (state.screen === "search") {
          const results = document.getElementById("search-results");
          if (results) renderSearchResults(results, state, actions);
        }
      } catch (err) {
        // Informational only.
      }
    }

    // Outletid tab's own data — fully separate from groceries (see
    // outlets/ and CLAUDE.md's "Outlets" section), optional: the tab
    // still shows (with an empty mall list) if these haven't loaded.
    async function loadOutletMalls() {
      try {
        const response = await fetch("/outlets/data/malls.json");
        if (!response.ok) return;
        const data = await response.json();
        if (!Array.isArray(data.malls)) return;
        state.outletMalls = data.malls;
        render();
      } catch (err) {
        // Informational only.
      }
    }

    const OUTLET_BRAND_FILES = ["/outlets/data/denim-dream.json"];

    async function loadOutletBrands() {
      const brands = [];
      for (const path of OUTLET_BRAND_FILES) {
        try {
          const response = await fetch(path);
          if (!response.ok) continue;
          const data = await response.json();
          if (data && data.brand) brands.push(data);
        } catch (err) {
          // Informational only — one missing brand file never blocks the rest.
        }
      }
      state.outletBrands = brands;
      render();
    }

    window.addEventListener("hashchange", applyRoute);
    loadPrices();
    loadUpdateStatus();
    loadSingles();
    loadOutletMalls();
    loadOutletBrands();
  </script>
</body>
</html>
